<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leo Trovato — genuine markdowns on menswear, fragrance & watches</title>
<meta name="description" content="Genuine markdowns from authorised retailers. Menswear, fragrance and watches. No fakes, no inflated RRPs." />
<meta name="theme-color" content="#f7f3ea" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f3ea;
    --surface: #fffdf8;
    --border: #e2dbc9;
    --border-hover: #c9bfa3;
    --ink: #201c16;
    --ink-secondary: #6b6252;
    --ink-muted: #9c9280;
    --accent: #6b2b2b;
    --accent-tint: #f6e9e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 48px 20px 80px; }

  header { margin-bottom: 4px; padding-bottom: 26px; border-bottom: 1px solid var(--border); }
  h1 {
    font-family: "Marcellus", Georgia, serif;
    font-size: 38px;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.06em;
  }
  .tagline { font-size: 13px; color: var(--ink-secondary); margin: 12px 0 6px; max-width: 46ch; line-height: 1.65; }
  .updated { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.1em; }

  nav.index {
    display: flex; gap: 28px; flex-wrap: wrap;
    margin: 28px 0 36px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-muted); cursor: pointer; user-select: none;
    padding: 0 0 12px; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 150ms ease, border-color 150ms ease;
  }
  .tab:hover { color: var(--ink-secondary); }
  .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  #feed { display: grid; grid-template-columns: 1fr; gap: 36px 28px; }
  @media (min-width: 680px) { #feed { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1020px) { #feed { grid-template-columns: 1fr 1fr 1fr; } }

  .card {
    display: flex; flex-direction: column;
    text-decoration: none; color: inherit;
  }
  .thumb-wrap {
    position: relative; width: 100%; aspect-ratio: 4 / 5;
    background: var(--surface); border: 1px solid var(--border);
    overflow: hidden; margin-bottom: 16px;
  }
  .thumb {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 400ms ease;
  }
  .card:hover .thumb { transform: scale(1.03); }
  .thumb-empty { width: 100%; height: 100%; }

  .stamp {
    position: absolute; top: 12px; right: 12px;
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--bg); border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-6deg);
    color: var(--accent); font-size: 13px; font-weight: 600;
  }
  .stamp.dropped { border-style: double; border-width: 3px; }

  .card-body { flex: 1; }
  .meta-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 7px; }
  .shop { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .established { font-size: 10px; letter-spacing: 0.04em; color: var(--ink-muted); }

  .title { font-family: "Marcellus", Georgia, serif; font-size: 19px; font-weight: 400; margin: 0 0 5px; line-height: 1.32; }
  .note { font-size: 13px; color: var(--ink-secondary); margin: 5px 0 0; line-height: 1.55; }
  .sizes { font-size: 11px; color: var(--ink-muted); margin: 10px 0 0; letter-spacing: 0.03em; }

  .lowflag {
    display: inline-block; margin: 10px 0 0;
    font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--accent); border: 1px solid var(--accent);
    padding: 3px 8px;
  }
  .tracked { font-size: 10px; color: var(--ink-muted); margin: 9px 0 0; letter-spacing: 0.04em; }

  .price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
  .price-from { font-size: 10px; color: var(--ink-muted); margin-right: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .price { font-size: 17px; font-weight: 600; }
  .was { font-size: 12px; color: var(--ink-muted); text-decoration: line-through; margin-left: 7px; }
  .link { font-size: 10px; color: var(--ink); text-transform: uppercase; letter-spacing: 0.09em; white-space: nowrap; }

  .section-head {
    grid-column: 1 / -1;
    font-family: "Marcellus", Georgia, serif;
    font-size: 15px; letter-spacing: 0.06em;
    color: var(--ink);
    padding: 6px 0 4px;
    border-bottom: 1px solid var(--border);
  }
  .section-head:not(:first-child) { margin-top: 8px; }

  .empty { text-align: center; padding: 64px 20px; color: var(--ink-secondary); font-size: 14px; grid-column: 1 / -1; }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--border); padding-top: 18px; margin-top: 20px;
  }
  footer span { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Leo Trovato</h1>
    <p class="tagline">Prices watched over time at authorised retailers — so a markdown is measured against what an item actually sold for, not an invented RRP.</p>
    <span class="updated" id="updated"></span>
  </header>

  <nav class="index" id="pills">
    <span class="tab active" data-cat="all" tabindex="0">All</span>
    <span class="tab" data-cat="menswear" tabindex="0">Menswear</span>
    <span class="tab" data-cat="fragrance" tabindex="0">Fragrance</span>
    <span class="tab" data-cat="watches" tabindex="0">Watches</span>
  </nav>

  <div id="feed"></div>

  <footer>
    <span>Affiliate links — we may earn a commission</span>
    <span id="count"></span>
  </footer>
</div>

<script>
let allItems = [];
let activeCategory = 'all';

function fmtMoney(n) {
  return '£' + Number(n).toFixed(2).replace(/\.00$/, '');
}

function timeAgo(unixSeconds) {
  const mins = Math.round((Date.now() / 1000 - unixSeconds) / 60);
  if (mins < 60) return `Updated ${mins} min ago`;
  const hours = Math.round(mins / 60);
  return `Updated ${hours}h ago`;
}

function categoryLabel(cat) {
  return { menswear: 'Menswear', fragrance: 'Fragrance', watches: 'Watches' }[cat] || cat;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function renderCard(item) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = item.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer sponsored';

  const fullTitle = item.brand ? item.brand + ' ' + item.title : item.title;

  let sizesLine = '';
  if (item.sizes && item.sizes.length) {
    const shown = item.sizes.slice(0, 8);
    const extra = item.sizes.length - shown.length;
    sizesLine = shown.map(escapeHtml).join(' · ') + (extra > 0 ? ` +${extra}` : '');
  }

  const thumbInner = item.photo
    ? `<img class="thumb" src="${escapeHtml(item.photo)}" alt="" loading="lazy" onerror="this.parentElement.classList.add('thumb-empty'); this.remove();" />`
    : '';

  a.innerHTML = `
    <div class="thumb-wrap${item.photo ? '' : ' thumb-empty'}">
      ${thumbInner}
      <span class="stamp mono${item.price_dropped ? ' dropped' : ''}">-${item.discount_pct}%</span>
    </div>
    <div class="card-body">
      <div class="meta-row">
        <span class="shop">${escapeHtml(categoryLabel(item.category))} · ${escapeHtml(item.shop)}</span>
        ${item.is_notable_brand ? '<span class="established">Established house</span>' : ''}
      </div>
      <p class="title">${escapeHtml(fullTitle)}</p>
      ${item.note ? `<p class="note">${escapeHtml(item.note)}</p>` : ''}
      ${sizesLine ? `<p class="sizes mono">${sizesLine}</p>` : ''}
      ${item.at_observed_low ? '<span class="lowflag">Lowest we\'ve tracked</span>' : ''}
      ${!item.at_observed_low && item.has_history && item.below_observed_high >= 10 ? `<p class="tracked mono">${item.below_observed_high}% below its usual price here</p>` : ''}
      ${item.has_history && item.observed_low && !item.at_observed_low ? `<p class="tracked mono">Tracked low ${fmtMoney(item.observed_low)} · ${item.observations} checks</p>` : ''}
      <div class="price-row">
        <span class="mono">${item.price_is_from ? '<span class="price-from">From</span>' : ''}<span class="price">${fmtMoney(item.price_amount)}</span>${item.compare_at ? `<span class="was">${fmtMoney(item.compare_at)}</span>` : ''}</span>
        <span class="link">View →</span>
      </div>
    </div>
  `;
  return a;
}

function render() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  const items = activeCategory === 'all' ? allItems : allItems.filter(i => i.category === activeCategory);

  if (!items.length) {
    feed.innerHTML = '<p class="empty">Nothing here right now — check back soon.</p>';
  } else if (activeCategory === 'all') {
    const order = ['menswear', 'fragrance', 'watches'];
    const grouped = {};
    items.forEach(i => { (grouped[i.category] = grouped[i.category] || []).push(i); });
    const cats = order.filter(c => grouped[c]).concat(
      Object.keys(grouped).filter(c => !order.includes(c))
    );
    cats.forEach(cat => {
      const head = document.createElement('div');
      head.className = 'section-head';
      head.textContent = categoryLabel(cat);
      feed.appendChild(head);
      grouped[cat].forEach(item => feed.appendChild(renderCard(item)));
    });
  } else {
    items.forEach(item => feed.appendChild(renderCard(item)));
  }
  document.getElementById('count').textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
}

function activateTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeCategory = tab.dataset.cat;
  render();
}

document.getElementById('pills').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) activateTab(tab);
});
document.getElementById('pills').addEventListener('keydown', (e) => {
  const tab = e.target.closest('.tab');
  if (tab && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    activateTab(tab);
  }
});

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allItems = data.feed || [];
    document.getElementById('updated').textContent = timeAgo(data.generated_at);
    render();
  })
  .catch(() => {
    document.getElementById('feed').innerHTML = '<p class="empty">Feed not available yet — the first scan hasn\'t run.</p>';
  });
</script>
</body>
</html>
