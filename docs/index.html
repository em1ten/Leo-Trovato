<script type="application/ld+json">{"@context": "https://schema.org", "@type": "WebSite", "name": "Proper Finds", "url": "https://em1ten.github.io/Leo-Trovato/", "description": "Genuine markdowns on menswear, fragrance and watches — checked against real price history, not an invented RRP.", "inLanguage": "en-GB"}</script>

<style>
  /* Bodoni Moda, self-hosted (SIL OFL 1.1, see fonts/OFL.txt). Only the two faces
     the pages actually render: 400 normal and 400 italic. The 500 italic h1 has
     always rendered with the 400 italic face; unicode-range means latin-ext is
     only downloaded if a title needs it. */
  @font-face { font-family: "Bodoni Moda"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/bodoni-moda-latin-400-normal.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Bodoni Moda"; font-style: normal; font-weight: 400; font-display: swap; src: url(fonts/bodoni-moda-latin-ext-400-normal.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/bodoni-moda-latin-400-italic.woff2) format("woff2"); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400; font-display: swap; src: url(fonts/bodoni-moda-latin-ext-400-italic.woff2) format("woff2"); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  :root {
    --bg: #faf9f7;
    --ink: #141412;
    --ink-secondary: #5c5a55;
    --ink-muted: #73706a; /* was #9a9790 (2.77:1 on --bg); now 4.69:1, passes WCAG AA for small text */
    --hairline: #e4e2dc;
    --accent: #6b2b2b;
    --tag-bg: #141412;
    --tag-text: #faf9f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Bodoni Moda", Georgia, serif; }
  .tabular { font-variant-numeric: tabular-nums; }

  .wrap { max-width: 1160px; margin: 0 auto; padding: 56px 24px 96px; }

  header { margin-bottom: 4px; }
  h1 {
    font-family: "Bodoni Moda", Georgia, serif;
    font-size: 44px;
    font-weight: 500;
    font-style: italic;
    margin: 0;
    letter-spacing: 0.01em;
  }
  .tagline { font-size: 13px; color: var(--ink-secondary); margin: 14px 0 6px; max-width: 44ch; line-height: 1.7; letter-spacing: 0.01em; }
  .updated { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.12em; }

  .index {
    display: flex; gap: 32px; flex-wrap: wrap;
    margin: 40px 0 44px;
    padding-top: 24px;
    border-top: 1px solid var(--ink);
  }
  /* Category filters and "Clear filters" are real <button>s (keyboard and
     screen-reader support for free); these lines strip the browser button look. */
  .tab, .filter-clear {
    font-family: inherit; background: none; border: 0; border-radius: 0; margin: 0;
    -webkit-appearance: none; appearance: none;
  }
  .tab {
    font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--ink-muted); cursor: pointer; user-select: none;
    padding: 0 0 4px; border-bottom: 1px solid transparent;
    transition: color 150ms ease, border-color 150ms ease;
  }
  /* Invisible hit area: the tab text is ~19px tall, too small to tap reliably.
     The pseudo-element enlarges the button to ~44px without moving anything. */
  .tab, .filter-clear, footer a { position: relative; }
  .tab::before, .filter-clear::before, footer a::before {
    content: ""; position: absolute; inset: -13px -10px -12px;
  }
  .tab:hover { color: var(--ink-secondary); }
  .tab:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--ink); }

  .filters { display: flex; gap: 24px; flex-wrap: wrap; align-items: baseline; margin: -20px 0 36px; }
  .filter-field { display: flex; flex-direction: column; gap: 4px; }
  .filter-label { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-muted); }
  .filter-input, .filter-select {
    font-family: inherit; font-size: 13px; color: var(--ink);
    background: transparent; border: none; border-bottom: 1px solid var(--ink-muted); /* field edge needs 3:1 (WCAG 1.4.11); --hairline is 1.23:1 */
    padding: 4px 0; min-width: 160px;
  }
  .filter-input:focus, .filter-select:focus { outline: none; border-bottom-color: var(--ink); }
  .filter-input::placeholder { color: var(--ink-muted); }
  .filter-clear {
    font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-muted); text-decoration: underline; cursor: pointer;
    align-self: flex-end; padding: 0 0 5px; display: none;
  }
  .filter-clear.visible { display: inline; }
  .filter-input:focus-visible, .filter-select:focus-visible, .filter-clear:focus-visible, footer a:focus-visible {
    outline: 1px solid var(--ink); outline-offset: 3px;
  }

  #feed { display: grid; grid-template-columns: 1fr; gap: 56px 40px; }
  /* Hold the space until data.json arrives so the footer doesn't jump (CLS). */
  #feed[aria-busy="true"] { min-height: 100vh; }
  @media (min-width: 680px) { #feed { grid-template-columns: 1fr 1fr; } }
  @media (min-width: 1040px) { #feed { grid-template-columns: 1fr 1fr 1fr; } }

  .card {
    display: flex; flex-direction: column;
    text-decoration: none; color: inherit;
  }
  .thumb-wrap {
    position: relative; width: 100%; aspect-ratio: 4 / 5;
    background: #efeee9;
    overflow: hidden; margin-bottom: 18px;
  }
  .thumb {
    width: 100%; height: 100%; object-fit: cover;
    transition: transform 500ms cubic-bezier(0.2, 0.7, 0.3, 1);
    display: block;
  }
  .card:hover .thumb { transform: scale(1.025); }

  .tag {
    position: absolute; top: 0; left: 0;
    background: var(--tag-bg); color: var(--tag-text);
    font-size: 11px; letter-spacing: 0.05em;
    padding: 6px 11px;
  }
  .tag.dropped { background: var(--accent); }

  .card-body { flex: 1; }
  .meta-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .shop { font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .established { font-size: 11px; font-style: italic; color: var(--ink-muted); font-family: "Bodoni Moda", Georgia, serif; }

  /* .title is an h2 or h3 and .section-head an h2, so heading defaults are reset here. */
  .title { font-family: "Bodoni Moda", Georgia, serif; font-size: 20px; font-weight: 400; margin: 0 0 6px; line-height: 1.3; }
  .note { font-size: 13px; color: var(--ink-secondary); margin: 6px 0 0; line-height: 1.6; }
  .sizes { font-size: 11px; color: var(--ink-muted); margin: 12px 0 0; letter-spacing: 0.02em; }

  .lowflag {
    display: inline-block; margin: 12px 0 0;
    font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--accent);
    padding-bottom: 2px; border-bottom: 1px solid var(--accent);
  }
  .tracked { font-size: 10px; color: var(--ink-muted); margin: 10px 0 0; letter-spacing: 0.03em; }

  .price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--hairline); }
  .price-from { font-size: 10px; color: var(--ink-muted); margin-right: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .price { font-size: 18px; font-weight: 500; }
  .was { font-size: 12px; color: var(--ink-muted); text-decoration: line-through; margin-left: 8px; }
  .link { font-size: 10px; color: var(--ink); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }

  .section-head {
    grid-column: 1 / -1;
    font-family: "Bodoni Moda", Georgia, serif;
    font-style: italic;
    font-size: 17px;
    font-weight: 400;
    line-height: normal;
    margin: 0;
    color: var(--ink);
    padding: 0 0 10px;
    border-bottom: 1px solid var(--ink);
  }
  .section-head:not(:first-child) { margin-top: 12px; }

  .empty { text-align: center; padding: 72px 20px; color: var(--ink-secondary); font-size: 14px; grid-column: 1 / -1; }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--hairline); padding-top: 20px; margin-top: 28px;
  }
  footer span { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.02em; }
  footer a { color: inherit; }

  @media (pointer: coarse) {
    /* Touch screens (phones and tablets): 16px stops iOS Safari zooming the page
       when a field gets focus; 44px is the touch-target height Apple and Google recommend. */
    .filter-input, .filter-select { font-size: 16px; min-height: 44px; }
    .filter-clear { padding-bottom: 14px; }
  }
  @media (max-width: 679px) {
    /* Size + Price share a row, Sort + Clear the next: products start higher. */
    .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 24px; align-items: end; }
    .filter-input, .filter-select { min-width: 0; width: 100%; }
    .filter-clear { justify-self: start; }
  }
  @media (max-width: 419px) {
    /* At 32px gaps the four tabs need 347px and wrapped "Watches" onto a second line at 390px. */
    .index { gap: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .thumb, .tab { transition: none; }
    .card:hover .thumb { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Proper Finds</h1>
    <p class="tagline">Every discount checked against its own price history — not an invented RRP.</p>
    <span class="updated" id="updated">&nbsp;</span>
  </header>

  <main>
  <div class="index" id="pills" role="group" aria-label="Category">
    <button type="button" class="tab active" data-cat="all" aria-pressed="true">All</button>
    <button type="button" class="tab" data-cat="menswear" aria-pressed="false">Menswear</button>
    <button type="button" class="tab" data-cat="fragrance" aria-pressed="false">Fragrance</button>
    <button type="button" class="tab" data-cat="watches" aria-pressed="false">Watches</button>
  </div>

  <div class="filters">
    <div class="filter-field">
      <label class="filter-label" for="sizeFilter">Size</label>
      <input class="filter-input" id="sizeFilter" type="text" placeholder="e.g. M, W32, UK 9" />
    </div>
    <div class="filter-field">
      <label class="filter-label" for="priceFilter">Price</label>
      <select class="filter-select" id="priceFilter">
        <option value="">Any price</option>
        <option value="0-50">Under £50</option>
        <option value="50-100">£50 – £100</option>
        <option value="100-250">£100 – £250</option>
        <option value="250-500">£250 – £500</option>
        <option value="500-999999">£500+</option>
      </select>
    </div>
    <div class="filter-field">
      <label class="filter-label" for="sortOrder">Sort</label>
      <select class="filter-select" id="sortOrder">
        <option value="recommended">Recommended</option>
        <option value="discount">Biggest discount</option>
      </select>
    </div>
    <button type="button" class="filter-clear" id="filterClear">Clear filters</button>
  </div>

  <div id="feed" aria-busy="true"></div>
  </main>

  <footer>
    <span>Affiliate links — we may earn a commission · <a href="how-it-works.html">How we check</a></span>
    <span id="count" role="status"></span>
  </footer>
</div>

</body>
</html>
