<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leo Trovato — genuine markdowns on menswear, fragrance & watches</title>
<meta name="description" content="Genuine markdowns from authorised retailers. Menswear, fragrance and watches. No fakes, no inflated RRPs." />
<meta name="theme-color" content="#f7f3ea" />
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f3ea;
    --surface: #fffdf8;
    --border: #e2dbc9;
    --border-hover: #c9bfa3;
    --ink: #201c16;
    --ink-secondary: #6b6252;
    --ink-muted: #9c9280;
    --accent: #6b2b2b;
    --accent-tint: #f6e9e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 32px 16px 64px; }

  header { margin-bottom: 4px; border-bottom: 1px solid var(--border); padding-bottom: 18px; }
  h1 {
    font-family: "Marcellus", Georgia, serif;
    font-size: 32px;
    font-weight: 400;
    margin: 0;
    letter-spacing: 0.05em;
  }
  .tagline { font-size: 13px; color: var(--ink-secondary); margin: 8px 0 4px; max-width: 42ch; line-height: 1.55; }
  .updated { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; }

  nav.index {
    display: flex; gap: 22px; flex-wrap: wrap;
    margin: 20px 0 26px;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--ink-muted); cursor: pointer; user-select: none;
    padding: 0 0 10px; border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 120ms ease, border-color 120ms ease;
  }
  .tab:hover { color: var(--ink-secondary); }
  .tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .tab.active { color: var(--ink); border-bottom-color: var(--accent); }

  #feed { display: grid; grid-template-columns: 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); }
  @media (min-width: 720px) {
    #feed { grid-template-columns: 1fr 1fr; }
  }

  .card {
    background: var(--surface); padding: 18px;
    display: flex; gap: 14px; align-items: flex-start;
    text-decoration: none; color: inherit;
    position: relative;
    transition: background 120ms ease;
  }
  .card:hover { background: var(--accent-tint); }
  .card:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .card-body { flex: 1; min-width: 0; }
  .thumb {
    width: 84px; height: 84px; flex-shrink: 0;
    border: 1px solid var(--border);
    object-fit: cover; background: var(--bg);
  }
  @media (max-width: 420px) { .thumb { width: 68px; height: 68px; } }

  .meta-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .shop { font-size: 11px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 3px; }

  .stamp {
    flex-shrink: 0;
    width: 46px; height: 46px;
    border-radius: 50%;
    border: 1.5px solid var(--accent);
    display: flex; align-items: center; justify-content: center;
    transform: rotate(-6deg);
    color: var(--accent);
    font-size: 12px; font-weight: 600;
    line-height: 1.1; text-align: center;
  }
  .stamp .pct { font-size: 13px; }
  .stamp.dropped { border-style: double; border-width: 3px; }

  .title { font-family: "Marcellus", Georgia, serif; font-size: 17px; font-weight: 400; margin: 0 0 3px; line-height: 1.3; }
  .note { font-size: 13px; color: var(--ink-secondary); margin: 3px 0 0; line-height: 1.5; }
  .sizes { font-size: 11px; color: var(--ink-muted); margin: 8px 0 0; letter-spacing: 0.03em; }

  .price-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 12px; }
  .price-from { font-size: 11px; color: var(--ink-muted); margin-right: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
  .price { font-size: 16px; font-weight: 600; }
  .was { font-size: 12px; color: var(--ink-muted); text-decoration: line-through; margin-left: 7px; }
  .link { font-size: 11px; color: var(--ink); text-transform: uppercase; letter-spacing: 0.08em; white-space: nowrap; }

  .empty { text-align: center; padding: 56px 20px; color: var(--ink-secondary); font-size: 14px; grid-column: 1 / -1; background: var(--surface); }

  footer {
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    border-top: 1px solid var(--border); padding-top: 16px; margin-top: 0;
  }
  footer span { font-size: 11px; color: var(--ink-muted); letter-spacing: 0.02em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Leo Trovato</h1>
    <p class="tagline">Genuine markdowns from authorised retailers. No fakes, no inflated RRPs.</p>
    <span class="updated" id="updated"></span>
  </header>

  <nav class="index" id="pills">
    <span class="tab active" data-cat="all" tabindex="0">All</span>
    <span class="tab" data-cat="menswear" tabindex="0">Menswear</span>
    <span class="tab" data-cat="fragrance" tabindex="0">Fragrance</span>
    <span class="tab" data-cat="watches" tabindex="0">Watches</span>
  </nav>

  <div id="feed"></div>

  <footer style="margin-top: 22px;">
    <span>Affiliate links — we may earn a commission</span>
    <span id="count"></span>
  </footer>
</div>

<script>
let allItems = [];
let activeCategory = 'all';

function fmtMoney(n) {
  return '£' + Number(n).toFixed(2).replace(/\.00$/, '');
}

function timeAgo(unixSeconds) {
  const mins = Math.round((Date.now() / 1000 - unixSeconds) / 60);
  if (mins < 60) return `Updated ${mins} min ago`;
  const hours = Math.round(mins / 60);
  return `Updated ${hours}h ago`;
}

function categoryLabel(cat) {
  return { menswear: 'Menswear', fragrance: 'Fragrance', watches: 'Watches' }[cat] || cat;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}

function renderCard(item) {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = item.url;
  a.target = '_blank';
  a.rel = 'noopener noreferrer sponsored';

  const fullTitle = item.brand ? item.brand + ' ' + item.title : item.title;

  let sizesLine = '';
  if (item.sizes && item.sizes.length) {
    const shown = item.sizes.slice(0, 8);
    const extra = item.sizes.length - shown.length;
    sizesLine = shown.map(escapeHtml).join(' · ') + (extra > 0 ? ` +${extra}` : '');
  }

  a.innerHTML = `
    ${item.photo ? `<img class="thumb" src="${escapeHtml(item.photo)}" alt="" loading="lazy" onerror="this.remove()" />` : ''}
    <div class="card-body">
      <div class="meta-row">
        <span class="shop">${escapeHtml(categoryLabel(item.category))} · ${escapeHtml(item.shop)}</span>
        <span class="stamp mono${item.price_dropped ? ' dropped' : ''}"><span class="pct">-${item.discount_pct}%</span></span>
      </div>
      <p class="title">${escapeHtml(fullTitle)}</p>
      ${item.note ? `<p class="note">${escapeHtml(item.note)}</p>` : ''}
      ${sizesLine ? `<p class="sizes mono">${sizesLine}</p>` : ''}
      <div class="price-row">
        <span class="mono">${item.price_is_from ? '<span class="price-from">From</span>' : ''}<span class="price">${fmtMoney(item.price_amount)}</span>${item.compare_at ? `<span class="was">${fmtMoney(item.compare_at)}</span>` : ''}</span>
        <span class="link">View →</span>
      </div>
    </div>
  `;
  return a;
}

function render() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  const items = activeCategory === 'all' ? allItems : allItems.filter(i => i.category === activeCategory);
  if (!items.length) {
    feed.innerHTML = '<p class="empty">Nothing here right now — check back soon.</p>';
  } else {
    items.forEach(item => feed.appendChild(renderCard(item)));
  }
  document.getElementById('count').textContent = `${items.length} item${items.length === 1 ? '' : 's'}`;
}

function activateTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeCategory = tab.dataset.cat;
  render();
}

document.getElementById('pills').addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) activateTab(tab);
});
document.getElementById('pills').addEventListener('keydown', (e) => {
  const tab = e.target.closest('.tab');
  if (tab && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    activateTab(tab);
  }
});

fetch('data.json?t=' + Date.now())
  .then(r => r.json())
  .then(data => {
    allItems = data.feed || [];
    document.getElementById('updated').textContent = timeAgo(data.generated_at);
    render();
  })
  .catch(() => {
    document.getElementById('feed').innerHTML = '<p class="empty">Feed not available yet — the first scan hasn\'t run.</p>';
  });
</script>
</body>
</html>
